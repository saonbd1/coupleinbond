name: Daily polls

on:
  schedule:
    # Publishing cadence: one poll + one companion article, Mon/Wed/Fri.
    # The 30-entry POLL_BANK in scripts/daily_polls.py is what sets this
    # pace -- at the old 2-per-day the whole bank was recycled in 15 days
    # and repeated entries re-emitted their article byte for byte. The
    # publishing days themselves are chosen by the "Skip on non-publishing
    # weekdays" step below (Asia/Dhaka), so changing the cadence is a
    # one-line edit there, not a cron rewrite.
    #
    # GitHub's cron scheduler is best-effort ("delays can be multiple hours
    # during periods of high load", and 03:00 UTC is exactly an hour
    # boundary). This workflow was starting 4-7 hours after its slot, so a
    # single 03:00 UTC trigger published the daily content around 13:30
    # Asia/Dhaka instead of 09:00.
    #
    # Three slots per day (01:00, 05:00, 09:00 Asia/Dhaka = 19:00, 23:00,
    # 03:00 UTC): whichever fires first publishes the day's poll, the
    # "Skip when today's polls already exist" guard makes the remaining
    # slots cheap no-ops, and `concurrency` keeps them from overlapping.
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Polls to generate (1-3)"
        required: false
        default: "1"
      date:
        description: "Target date YYYY-MM-DD (default: today in Asia/Dhaka)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-polls
  cancel-in-progress: false

# Run everything in Asia/Dhaka so "today", the poll date label and the
# commit message all match the intended publishing day (UTC runners would
# otherwise roll over at 06:00 Dhaka time).
env:
  TZ: Asia/Dhaka

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git for bot commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true

      - name: Skip on non-publishing weekdays
        id: weekday
        run: |
          set -e
          # The crons fire every day so GitHub's scheduler lag is absorbed by
          # the repeat slots; the cadence itself lives here. Weekday numbers
          # are 1=Mon .. 7=Sun in Asia/Dhaka. Manual runs always publish.
          # This runs before the toolchain setup so a non-publishing day is
          # a ~10 second no-op.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW="$(date +%u)"
          case "$DOW" in
            1|3|5) echo "Publishing day (weekday $DOW)."
                   echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)     echo "Not a publishing day (weekday $DOW) - nothing to do."
                   echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Setup Python
        if: steps.weekday.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        if: steps.weekday.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.weekday.outputs.publish == 'true'
        run: npm ci

      - name: Resolve target date (Asia/Dhaka)
        id: target
        if: steps.weekday.outputs.publish == 'true'
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE="$(date +%F)"
          fi
          case "$DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "Invalid target date '$DATE' (expected YYYY-MM-DD)" >&2; exit 1 ;;
          esac
          # Reject impossible dates (e.g. 2026-02-31) before doing any work.
          if [ "$(date -d "$DATE" +%F 2>/dev/null)" != "$DATE" ]; then
            echo "Invalid target date '$DATE' (not a real calendar date)" >&2
            exit 1
          fi
          echo "Target date: $DATE  (timezone: $(date +%Z), now: $(date '+%F %T'))"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Skip when today's polls already exist
        id: guard
        if: steps.weekday.outputs.publish == 'true'
        run: |
          set -e
          STAMP="$(printf '%s' '${{ steps.target.outputs.date }}' | tr -d '-')"
          if ls src/content/polls/*-"$STAMP".md >/dev/null 2>&1; then
            echo "Polls dated $STAMP already exist - nothing to generate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No polls dated $STAMP yet - generating."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate daily polls (no commit yet)
        if: steps.weekday.outputs.publish == 'true' && steps.guard.outputs.skip != 'true'
        env:
          INPUT_COUNT: ${{ github.event.inputs.count }}
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -xe
          COUNT="${INPUT_COUNT:-2}"
          # Guard count to 1-3 (script choices=[1,2,3])
          case "$COUNT" in
            1|2|3) ;;
            *) echo "Invalid count '$COUNT', defaulting to 2"; COUNT=2 ;;
          esac
          # NOTE: no --commit/--push here. We validate first,
          # then commit+push in the dedicated step below so a
          # broken build never gets pushed.
          python3 scripts/daily_polls.py --count "$COUNT" --date "$TARGET_DATE"

      - name: Validate release (localized content + build + SEO + links)
        if: steps.weekday.outputs.publish == 'true' && steps.guard.outputs.skip != 'true'
        run: npm run validate:release

      - name: Commit and push (only if files changed)
        if: steps.weekday.outputs.publish == 'true' && steps.guard.outputs.skip != 'true'
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -xe
          git add public/poll-data.js src/content/polls src/content/blog public/sitemap.xml scripts/poll_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit - polls already up to date."
            exit 0
          fi
          git commit -m "Add daily poll(s) for ${TARGET_DATE}"
          git pull --rebase || true
          # Retry push 3x in case main moved under us
          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "push attempt $i failed, rebasing..."
            git pull --rebase || true
            sleep 5
          done
          git status --short
