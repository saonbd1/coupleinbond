name: Daily polls

on:
  schedule:
    # 09:00 Asia/Dhaka (GMT+6) = 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Polls to generate (1-3)"
        required: false
        default: "2"
      date:
        description: "Target date YYYY-MM-DD (default: today)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish daily polls
        run: |
          COUNT="${{ inputs.count }}"
          DATE="${{ inputs.date }}"
          ARGS="--count ${COUNT:-2} --commit --push"
          if [ -n "$DATE" ]; then
            ARGS="$ARGS --date $DATE"
          fi
          python3 scripts/daily_polls.py $ARGS

      - name: Validate release (localized content + build + SEO + links)
        run: npm run validate:release
